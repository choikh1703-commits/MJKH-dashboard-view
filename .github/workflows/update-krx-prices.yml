name: Update encrypted KRX prices

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: encrypted-krx-price-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch KRX regular-market prices
        run: node scripts/fetch_krx_live_prices.mjs
        env:
          PORTFOLIO_PRICE_CODES: ${{ secrets.PORTFOLIO_PRICE_CODES }}
          PORTFOLIO_DASHBOARD_PASSPHRASE: ${{ secrets.PORTFOLIO_DASHBOARD_PASSPHRASE }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          PRICE_OUTPUT_PATH: ${{ runner.temp }}/prices.enc.json
      - name: Publish encrypted price file
        shell: bash
        run: |
          if [ ! -f "${RUNNER_TEMP}/prices.enc.json" ]; then
            echo "No in-session price file was generated."
            exit 0
          fi
          git fetch origin live-prices
          git switch live-prices
          cp "${RUNNER_TEMP}/prices.enc.json" prices.enc.json
          git config user.name "Codex Portfolio Price Feed"
          git config user.email "choikh1703-commits@users.noreply.github.com"
          git add -- prices.enc.json
          if git diff --cached --quiet; then
            echo "No price change."
            exit 0
          fi
          git commit -m "chore: update encrypted KRX prices"
          git push
