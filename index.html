    const storageKey = 'mjkh_portfolio_dashboard_password_v1';
    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const rememberInput = document.getElementById('remember');
    const submitButton = document.getElementById('submit');
    const message = document.getElementById('message');

    function bytes(base64) {
      const binary = atob(base64);
      return Uint8Array.from(binary, (char) => char.charCodeAt(0));
    }

    async function decryptDashboard(password) {
      const material = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', hash: 'SHA-256', salt: bytes(payload.salt), iterations: payload.iterations },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: bytes(payload.iv), tagLength: 128 },
        key,
        bytes(payload.ciphertext)
      );
      return new TextDecoder().decode(plain);
    }

    async function openDashboard(password, remember) {
      submitButton.disabled = true;
      submitButton.textContent = '여는 중...';
      message.textContent = '';
      try {
        const html = await decryptDashboard(password);
        sessionStorage.setItem(storageKey, password);
        if (remember) localStorage.setItem(storageKey, password);
        else localStorage.removeItem(storageKey);
        document.open();
        document.write(html);
        document.close();
      } catch {
        sessionStorage.removeItem(storageKey);
        localStorage.removeItem(storageKey);
        message.textContent = '비밀번호가 맞지 않습니다.';
        submitButton.disabled = false;
        submitButton.textContent = '대시보드 열기';
        passwordInput.focus();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      openDashboard(passwordInput.value, rememberInput.checked);
    });

    const savedPassword = localStorage.getItem(storageKey);
    if (savedPassword) {
      passwordInput.value = savedPassword;
      openDashboard(savedPassword, true);
    }
  </script>
